name: Build Minimal Invoice

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate official Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build debug APK and release AAB
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Prepare distributable files
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Minimal-Invoice.apk
          cp app/build/outputs/bundle/release/app-release.aab output/Minimal-Invoice.aab

      - name: Upload APK and AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimal-invoice-apk
          path: |
            output/Minimal-Invoice.apk
            output/Minimal-Invoice.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/Minimal-Invoice.apk
            output/Minimal-Invoice.aab
          generate_release_notes: true
